# Fly.io: one always-on 256 MB machine in Frankfurt (fits the legacy free allowance).
# Measured 10.11.2026: about 100 MB idle, 228 MB peak with 16 parallel requests, so swap is the safety net.
app = 'bibblitz'
primary_region = 'fra'
swap_size_mb = 512

[build]

[env]
  # Keeps the V8 heap below the 256 MB machine so a spike goes to swap instead of an OOM kill
  NODE_OPTIONS = '--max-old-space-size=160'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = '10s'
    interval = '30s'
    method = 'GET'
    path = '/robots.txt'
    timeout = '5s'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
